name: "CI: DCC Driver source candidate (no native acceptance)"

on:
  push:
    branches: ["dcc-driver-0.33.2-compat-candidate-*"]
  pull_request:
    branches: ["dcc-driver-0.33.2-upstream"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact published candidate commit to compile"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: dcc-driver-source-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  source:
    name: "Windows / exact source compile (native acceptance pending)"
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Select exact source SHA
        id: source
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
        run: |
          $sourceSha = switch ($env:EVENT_NAME) {
            "pull_request" { $env:PR_HEAD_SHA }
            "push" { $env:EVENT_SHA }
            "workflow_dispatch" { $env:DISPATCH_SHA }
            default { throw "Unsupported source CI event" }
          }
          if ($sourceSha -cnotmatch '^[0-9a-f]{40}$') { throw "A full immutable source SHA is required" }
          "sha=$sourceSha" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $actual = git rev-parse --verify 'HEAD^{commit}'
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) { throw "Source checkout mismatch" }
          if ((git status --porcelain).Length -ne 0) { throw "Source checkout is dirty" }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/rust -> target"
          key: dcc-source-only
      - name: Check formatting
        run: cargo fmt --manifest-path libs/cua-driver/rust/Cargo.toml --all -- --check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install hash-locked inventory test tools
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/scripts/requirements-cua-driver-inventory.txt
      - name: Collect hermetic test classification inventory
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest -p no:cacheprovider --collect-only -q .github/scripts/tests/test_cua_driver_e2e_inventory.py
      - name: Run hermetic test classification inventory
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest -p no:cacheprovider -q .github/scripts/tests/test_cua_driver_e2e_inventory.py
      - name: Strict whole-package source lint
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p cua-driver -p cua-driver-e2e -p cua-driver-core -p cua-driver-sdk -p cua-driver-testkit -p cursor-overlay -p cursor-theme-cli -p platform-windows -p cua-driver-uia --all-targets -- -D warnings
      - name: Compile every test target without executing it
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p cua-driver -p cua-driver-e2e -p cua-driver-core -p cua-driver-sdk -p cua-driver-testkit -p cursor-overlay -p cursor-theme-cli -p platform-windows -p cua-driver-uia --all-targets --no-run
      - name: Record source-only boundary
        shell: pwsh
        run: |
          "Native Windows, browser, Host and permission-helper acceptance was not executed." >> $env:GITHUB_STEP_SUMMARY
          "Native workflows remain required before ready/merge; skipped draft jobs are not acceptance." >> $env:GITHUB_STEP_SUMMARY
